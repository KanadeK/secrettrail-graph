[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "secrettrail-graph"
version = "0.1.0"
description = "Build privacy-preserving propagation timelines for leaked secrets."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "KanadeK"}]
dependencies = [
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "networkx>=3.4,<4",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-networkx>=3.4,<4",
]

[project.scripts]
secrettrail = "leakloom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leakloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["leakloom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["leakloom"]
